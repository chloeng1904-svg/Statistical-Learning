name: Execute group analysis notebook

on:
  push:
    branches:
      - main
      - analysis/group-facing-notebook
    paths:
      - online_shoppers_analysis.ipynb
      - data/online_shoppers.csv
      - requirements.txt
      - .github/workflows/execute-notebook.yml
  pull_request:
    paths:
      - online_shoppers_analysis.ipynb
      - data/online_shoppers.csv
      - requirements.txt
      - .github/workflows/execute-notebook.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute all notebook cells
        run: |
          jupyter nbconvert --to notebook --execute online_shoppers_analysis.ipynb \
            --ExecutePreprocessor.timeout=7200 \
            --output online_shoppers_analysis_executed.ipynb
          mv online_shoppers_analysis_executed.ipynb online_shoppers_analysis.ipynb
      - name: Verify notebook and selected-model output
        run: |
          python - <<'PY'
          import nbformat, pathlib, re
          nb=nbformat.read('online_shoppers_analysis.ipynb',as_version=4)
          nbformat.validate(nb)
          cells=[c for c in nb.cells if c.cell_type=='code']
          assert cells and all(isinstance(c.execution_count,int) for c in cells)
          assert not any(o.output_type=='error' for c in cells for o in c.outputs)
          source='\n'.join(c.source for c in nb.cells)
          assert not re.search(r'\bPRD\b|\bv3[._-]\d+\b|artifacts/prd|archive/',source,re.I)
          summary='\n'.join(o.text for o in cells[-1].outputs if o.output_type=='stream')
          assert 'Winner: L1 | Logit' in summary, summary
          auc=re.search(r'mean five-fold ROC-AUC=(\d+\.\d+)',summary)
          reserved=re.search(r'Reserved-set ROC-AUC=(\d+\.\d+)',summary)
          assert auc and reserved, summary
          assert abs(float(auc.group(1))-0.75747)<0.0001
          assert abs(float(reserved.group(1))-0.74054)<0.0001
          print(f'PASS: {len(nb.cells)} notebook cells executed; selected model and reserved-set results verified.')
          PY
      - name: Save executed notebook to review branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/analysis/group-facing-notebook'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online_shoppers_analysis.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'results: save executed group notebook [skip ci]'
            git push origin HEAD:analysis/group-facing-notebook
          fi
      - name: Attach executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-group-notebook
          path: online_shoppers_analysis.ipynb
          retention-days: 14
